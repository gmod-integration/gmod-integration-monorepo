name: Test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: test-maria-root-password-not-a-real-secret
          MARIADB_DATABASE: gmod_test
          MARIADB_USER: test
          MARIADB_PASSWORD: test-maria-password-not-a-real-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      MARIA_URL: mysql://test:test-maria-password-not-a-real-secret@127.0.0.1:3306/gmod_test
      CONFIG_ENV_FILE: ${{ github.workspace }}/.env.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # MinIO needs `server /data` as a command, which the declarative `services:` block above
      # can't express (no `command` override there) - run it by hand instead.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9060:9000 \
            -e MINIO_ROOT_USER=test-minio-access-key \
            -e MINIO_ROOT_PASSWORD=test-minio-secret-key-not-a-real-secret \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9060/minio/health/live && break
            sleep 2
          done

      - name: Push Prisma schema to test database
        run: bunx prisma db push

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
