name: Test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  addon:
    name: Addon GLua transport and player tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pinned addon
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Lua test runtime
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Test addon transport, relay and player tools
        run: python3 submodules/gmod-integration/scripts/test_lua.py

  recovery:
    name: SQL migration and four-store recovery acceptance
    runs-on: ubuntu-latest
    env:
      CONFIG_ENV_FILE: ${{ github.workspace }}/.env.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Replay SQL migrations and verify real backup and restore
        run: python3 scripts/tests/swarm_recovery_roundtrip.py --run-disposable-docker-test

      - name: Pull isolated rolling test images
        run: |
          docker pull oven/bun:1.3.9
          docker pull traefik:v2.11

      - name: Verify rolling replacement through Traefik
        env:
          GMOD_ROLLING_DOCKER_TEST: "1"
          GMOD_ROLLING_BASE_IMAGE: oven/bun:1.3.9
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_proxmox_rolling_docker.py'

  quality:
    name: Lint, architecture, types and web builds
    runs-on: ubuntu-latest
    env:
      CONFIG_ENV_FILE: ${{ github.workspace }}/.env.test
      # Prisma loads its datasource URL even when generating without a database connection.
      MARIA_URL: mysql://test:test-maria-password-not-a-real-secret@127.0.0.1:3306/gmod_test
      FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      - name: Lint all TypeScript and TSX
        run: bun run lint

      - name: Check workspace boundaries and cycles
        run: bun run check:architecture

      - name: Test the architecture guard
        run: bun run test:architecture

      - name: Test development fixture generation and guards
        run: bun run test:seed:dev

      - name: Test deployment and recovery guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_swarm_ops.py'

      - name: Test production package update and migration guards
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_proxmox_production_update.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_proxmox_rolling*.py'

      - name: Test migration readiness guards
        run: bun test scripts/swarm-migration-status.test.ts

      # Ratchet formatting on changed files without silently excluding legacy source.
      # The full-tree formatting audit remains available as `bun run format:check`.
      - name: Check formatting of changed files
        shell: bash
        run: |
          if [[ -n "$FORMAT_BASE" && ! "$FORMAT_BASE" =~ ^0+$ ]]; then
            bun run format:check:changed "$FORMAT_BASE"
          else
            bun run format:check:changed HEAD
          fi

      - name: Typecheck backend, website and documentation
        run: bun run typecheck

      - name: Build the API for Bun
        run: bun run build

      - name: Build the website
        run: bun run --cwd apps/website build

      - name: Build the documentation
        run: bun run docs:build

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: test-maria-root-password-not-a-real-secret
          MARIADB_DATABASE: gmod_test
          MARIADB_USER: test
          MARIADB_PASSWORD: test-maria-password-not-a-real-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      MARIA_URL: mysql://test:test-maria-password-not-a-real-secret@127.0.0.1:3306/gmod_test
      CONFIG_ENV_FILE: ${{ github.workspace }}/.env.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      # MinIO needs `server /data` as a command, which the declarative `services:` block above
      # can't express (no `command` override there) - run it by hand instead.
      # MinIO no longer publishes pullable images (quay.io/minio and Docker Hub minio/minio both
      # deny access), so use Chainguard's free build of the same upstream server. It runs as uid
      # 65532 and needs a writable /data mount, hence the tmpfs.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9060:9000 \
            --tmpfs /data:uid=65532,gid=65532 \
            -e MINIO_ROOT_USER=test-minio-access-key \
            -e MINIO_ROOT_PASSWORD=test-minio-secret-key-not-a-real-secret \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9060/minio/health/live && break
            sleep 2
          done

      - name: Apply checked-in SQL migrations to the test database
        run: bun run prisma:migrate:prod

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
