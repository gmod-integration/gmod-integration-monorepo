name: Build

on:
  push:
    branches:
      - main

jobs:
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # - uses: sonarsource/sonarqube-quality-gate-action@master
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: test-maria-root-password-not-a-real-secret
          MARIADB_DATABASE: gmod_test
          MARIADB_USER: test
          MARIADB_PASSWORD: test-maria-password-not-a-real-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      MARIA_URL: mysql://test:test-maria-password-not-a-real-secret@127.0.0.1:3306/gmod_test
      CONFIG_ENV_FILE: ${{ github.workspace }}/.env.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # MinIO needs `server /data` as a command, which the declarative `services:` block above
      # can't express (no `command` override there) - run it by hand instead.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9060:9000 \
            -e MINIO_ROOT_USER=test-minio-access-key \
            -e MINIO_ROOT_PASSWORD=test-minio-secret-key-not-a-real-secret \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9060/minio/health/live && break
            sleep 2
          done

      - name: Push Prisma schema to test database
        run: bunx prisma db push

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  publish_images:
    name: Publish Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: discord
            dockerfile: apps/discord/Dockerfile
          - service: websocket
            dockerfile: apps/websocket/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'prisma.config.ts'
              - 'Dockerfile'
            api:
              - 'apps/api/**'
            discord:
              - 'apps/discord/**'
            websocket:
              - 'apps/websocket/**'

      - name: Decide whether to build this image
        id: should_build
        shell: bash
        run: |
          SHOULD_BUILD="false"
          if [[ "${{ steps.changes.outputs.shared }}" == "true" ]]; then
            SHOULD_BUILD="true"
          elif [[ "${{ matrix.service }}" == "api" && "${{ steps.changes.outputs.api }}" == "true" ]]; then
            SHOULD_BUILD="true"
          elif [[ "${{ matrix.service }}" == "discord" && "${{ steps.changes.outputs.discord }}" == "true" ]]; then
            SHOULD_BUILD="true"
          elif [[ "${{ matrix.service }}" == "websocket" && "${{ steps.changes.outputs.websocket }}" == "true" ]]; then
            SHOULD_BUILD="true"
          fi
          echo "value=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.value == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.should_build.outputs.value == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.should_build.outputs.value == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gmod-integration-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and push
        if: steps.should_build.outputs.value == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Skip unchanged service
        if: steps.should_build.outputs.value != 'true'
        run: echo "No relevant changes for '${{ matrix.service }}'; skipping image build."
