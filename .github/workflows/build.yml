name: Build

on:
  push:
    branches:
      - main
  # Manual run rebuilds every image. Path filtering only looks at the last push, so a push
  # whose build failed (e.g. on tests) is never caught up by the next push: use this then.
  workflow_dispatch:

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  publish_images:
    name: Publish Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: discord
            dockerfile: apps/discord/Dockerfile
          - service: websocket
            dockerfile: apps/websocket/Dockerfile
          - service: webhook-relay
            dockerfile: apps/webhook-relay/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend_release:
              - 'apps/api/**'
              - 'apps/discord/**'
              - 'apps/websocket/**'
              - 'packages/**'
              - 'scripts/**'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'prisma.config.ts'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-stack.swarm.yml'
              - '.github/workflows/**'
              - '.gitmodules'
              - 'submodules/gmod-integration'
            webhook_relay:
              - 'apps/webhook-relay/**'
              - 'bun.lock'
              - 'package.json'
              - 'apps/*/package.json'
              - 'packages/*/package.json'
              - '.dockerignore'
              - '.github/workflows/build.yml'

      - name: Decide whether to build this image
        id: should_build
        shell: bash
        run: |
          SHOULD_BUILD="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHOULD_BUILD="true"
          elif [[ "${{ matrix.service }}" == "webhook-relay" ]]; then
            # The standalone relay only depends on its source, lockfile and copied manifests.
            if [[ "${{ steps.changes.outputs.webhook_relay }}" == "true" ]]; then
              SHOULD_BUILD="true"
            fi
          elif [[ "${{ steps.changes.outputs.backend_release }}" == "true" ]]; then
            # Coordinated deployment requires all three application images at one source revision.
            SHOULD_BUILD="true"
          fi
          echo "value=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.value == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.should_build.outputs.value == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.should_build.outputs.value == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gmod-integration-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and push
        if: steps.should_build.outputs.value == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Skip unchanged service
        if: steps.should_build.outputs.value != 'true'
        run: echo "No relevant changes for '${{ matrix.service }}'; skipping image build."
