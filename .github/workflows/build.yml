name: Build

on:
  push:
    branches:
      - main

jobs:
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # - uses: sonarsource/sonarqube-quality-gate-action@master
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish_images:
    name: Publish Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: discord
            dockerfile: apps/discord/Dockerfile
          - service: websocket
            dockerfile: apps/websocket/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'prisma.config.ts'
              - 'Dockerfile'
            api:
              - 'apps/api/**'
            discord:
              - 'apps/discord/**'
            websocket:
              - 'apps/websocket/**'

      - name: Decide whether to build this image
        id: should_build
        shell: bash
        run: |
          SHOULD_BUILD="false"
          if [[ "${{ steps.changes.outputs.shared }}" == "true" ]]; then
            SHOULD_BUILD="true"
          elif [[ "${{ matrix.service }}" == "api" && "${{ steps.changes.outputs.api }}" == "true" ]]; then
            SHOULD_BUILD="true"
          elif [[ "${{ matrix.service }}" == "discord" && "${{ steps.changes.outputs.discord }}" == "true" ]]; then
            SHOULD_BUILD="true"
          elif [[ "${{ matrix.service }}" == "websocket" && "${{ steps.changes.outputs.websocket }}" == "true" ]]; then
            SHOULD_BUILD="true"
          fi
          echo "value=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.value == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.should_build.outputs.value == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.should_build.outputs.value == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gmod-integration-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and push
        if: steps.should_build.outputs.value == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Skip unchanged service
        if: steps.should_build.outputs.value != 'true'
        run: echo "No relevant changes for '${{ matrix.service }}'; skipping image build."
