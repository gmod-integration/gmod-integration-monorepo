name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pull repository and deploy
        env:
          NODE_ENV: production
        run: |
          ssh -o StrictHostKeyChecking=no ${{ variables.SSH_USER }}@${{ variables.SSH_HOST }} << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
            export PATH=$(nvm which current | xargs dirname):$PATH 
            cd ${{ variables.DEPLOY_PATH }}
            git pull origin main
            npm install
            pm2 restart gmod-integration-api
          EOF
