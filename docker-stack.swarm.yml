services:
  traefik:
    image: traefik:v2.11
    command:
      - --providers.docker=true
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=gmod_net
      - --entrypoints.web.address=:80
      # Metrics are available only inside the overlay; the management API stays disabled.
      - --entrypoints.metrics.address=:9100
      - --accesslog=true
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gmod_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  api:
    stop_grace_period: 120s
    image: ${API_IMAGE:-ghcr.io/gmod-integration/gmod-integration-api:latest}
    env_file:
      - .env
    environment:
      MARIA_HOST: mariadb
      MARIA_PORT: 3306
      REDIS_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULLMQ_HOST: redis
      BULLMQ_PORT: 6379
      MARIA_CONNECTION_LIMIT: 10
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_URI: mongodb://mongo:27017
      MINIO_ENDPOINT: http://minio:9000
    command:
      - /bin/sh
      - -lc
      - |
        i=1
        while [ "$$i" -le 120 ]; do
          if bun scripts/swarm-migration-status.ts; then
            echo "Checked-in migrations applied, starting API"
            exec bun apps/api/src/gm_integration_api.ts
          fi
          echo "Waiting for checked-in migrations before API start ($$i/120)..."
          i=$$(($$i+1))
          sleep 5
        done
        echo "Checked-in migrations not applied for API after 120 attempts"
        exit 1
    networks:
      - gmod_net
    deploy:
      mode: replicated
      # Only the coordinated release script enables application writers.
      replicas: 0
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 30s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        monitor: 120s
        failure_action: rollback
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 30s
        failure_action: pause
      labels:
        - traefik.enable=true
        - traefik.docker.network=gmod_net
        - traefik.http.routers.api.rule=Host(`${API_HOST:-api.localhost}`)
        - traefik.http.routers.api.entrypoints=web
        - traefik.http.services.api.loadbalancer.server.port=53136

  websocket:
    stop_grace_period: 120s
    image: ${WEBSOCKET_IMAGE:-ghcr.io/gmod-integration/gmod-integration-websocket:latest}
    env_file:
      - .env
    environment:
      MARIA_HOST: mariadb
      MARIA_PORT: 3306
      REDIS_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULLMQ_HOST: redis
      BULLMQ_PORT: 6379
      MARIA_CONNECTION_LIMIT: 10
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_URI: mongodb://mongo:27017
      MINIO_ENDPOINT: http://minio:9000
    command:
      - /bin/sh
      - -lc
      - |
        i=1
        while [ "$$i" -le 120 ]; do
          if bun scripts/swarm-migration-status.ts; then
            echo "Checked-in migrations applied, starting WebSocket"
            exec bun apps/websocket/src/index.ts
          fi
          echo "Waiting for checked-in migrations before WebSocket start ($$i/120)..."
          i=$$(($$i+1))
          sleep 5
        done
        echo "Checked-in migrations not applied for WebSocket after 120 attempts"
        exit 1
    networks:
      - gmod_net
    deploy:
      mode: replicated
      # Only the coordinated release script enables application writers.
      replicas: 0
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 30s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        monitor: 120s
        failure_action: rollback
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 30s
        failure_action: pause
      labels:
        - traefik.enable=true
        - traefik.docker.network=gmod_net
        - traefik.http.routers.websocket.rule=Host(`${WS_HOST:-ws.localhost}`)
        - traefik.http.routers.websocket.entrypoints=web
        - traefik.http.services.websocket.loadbalancer.server.port=53139

  discord:
    stop_grace_period: 120s
    image: ${DISCORD_IMAGE:-ghcr.io/gmod-integration/gmod-integration-discord:latest}
    env_file:
      - .env
    environment:
      MARIA_HOST: mariadb
      MARIA_PORT: 3306
      REDIS_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULLMQ_HOST: redis
      BULLMQ_PORT: 6379
      MARIA_CONNECTION_LIMIT: 10
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_URI: mongodb://mongo:27017
      MINIO_ENDPOINT: http://minio:9000
    command:
      - /bin/sh
      - -lc
      - |
        i=1
        while [ "$$i" -le 120 ]; do
          if bun scripts/swarm-migration-status.ts; then
            echo "Checked-in migrations applied, starting Discord"
            exec bun apps/discord/src/main.ts
          fi
          echo "Waiting for checked-in migrations before Discord start ($$i/120)..."
          i=$$(($$i+1))
          sleep 5
        done
        echo "Checked-in migrations not applied for Discord after 120 attempts"
        exit 1
    networks:
      - gmod_net
    deploy:
      mode: replicated
      # Only the coordinated release script enables application writers.
      replicas: 0
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 30s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        monitor: 120s
        failure_action: rollback
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        monitor: 30s
        failure_action: pause

  mariadb:
    stop_grace_period: 120s
    image: ${MARIADB_IMAGE:-mariadb:latest}
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIA_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIA_NAME}
      MARIADB_USER: ${MARIA_USER}
      MARIADB_PASSWORD: ${MARIA_PASSWORD}
    volumes:
      - gmod_mariadb_data:/var/lib/mysql
    networks:
      - gmod_net
    healthcheck:
      test: ["CMD-SHELL", 'mariadb-admin ping -h 127.0.0.1 -u"$${MARIA_USER}" -p"$${MARIA_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  prisma-migrate:
    image: ${API_IMAGE:-ghcr.io/gmod-integration/gmod-integration-api:latest}
    env_file:
      - .env
    environment:
      MARIA_HOST: mariadb
      MARIA_PORT: 3306
    command:
      - /bin/sh
      - -lc
      - |
        i=1
        while [ "$$i" -le 120 ]; do
          if bun -e "import * as mariadb from 'mariadb'; (async () => { try { const c = await mariadb.createConnection({ host: 'mariadb', port: Number(process.env.MARIA_PORT || 3306), user: process.env.MARIA_USER, password: process.env.MARIA_PASSWORD, database: process.env.MARIA_NAME }); await c.query('SELECT 1'); await c.end(); process.exit(0); } catch { process.exit(1); } })();"; then
            break
          fi
          echo "Waiting for MariaDB TCP/auth readiness ($$i/120)..."
          i=$$(($$i+1))
          sleep 5
        done
        if [ "$$i" -gt 120 ]; then
          echo "MariaDB not reachable after 120 attempts"
          exit 1
        fi
        echo "Applying checked-in Prisma migrations"
        exec bun scripts/swarm-migrate.ts
    networks:
      - gmod_net
    deploy:
      replicas: 0
      restart_policy:
        condition: none
      placement:
        constraints:
          - node.role == manager

  redis:
    stop_grace_period: 120s
    image: ${REDIS_IMAGE:-redis:latest}
    command:
      - redis-server
      - --maxmemory
      - 4gb
      - --maxmemory-policy
      - noeviction
    volumes:
      - gmod_redis_data:/data
    networks:
      - gmod_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 1G
      placement:
        constraints:
          - node.role == manager

  mongo:
    stop_grace_period: 120s
    image: ${MONGO_IMAGE:-mongo:latest}
    volumes:
      - gmod_mongo_data:/data/db
    networks:
      - gmod_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  minio:
    stop_grace_period: 120s
    # MinIO no longer publishes pullable images (quay.io/minio is private, Docker Hub minio/minio
    # is gone); Chainguard ships a free build of the same server. Run as root like the old image
    # so the existing root-owned data in gmod_minio_data stays readable without a chown.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    user: "0:0"
    command: server /data --console-address ':9001'
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - gmod_minio_data:/data
    networks:
      - gmod_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

volumes:
  gmod_mariadb_data:
  gmod_redis_data:
  gmod_mongo_data:
  gmod_minio_data:

networks:
  gmod_net:
    driver: overlay
    attachable: true
