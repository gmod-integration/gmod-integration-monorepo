version: "3.9"

services:
  api:
    image: ${API_IMAGE:-gmod-integration/api:latest}
    env_file:
      - .env
    environment:
      DEV: ${DEV:-false}
      MARIA_HOST: mariadb
      MARIA_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULLMQ_HOST: redis
      BULLMQ_PORT: 6379
      MONGO_URI: mongodb://mongo:27017
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - target: 53136
        published: 53136
        protocol: tcp
        mode: ingress
    networks:
      - gmod_net
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: start-first

  websocket:
    image: ${WEBSOCKET_IMAGE:-gmod-integration/websocket:latest}
    env_file:
      - .env
    environment:
      DEV: ${DEV:-false}
      MARIA_HOST: mariadb
      MARIA_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULLMQ_HOST: redis
      BULLMQ_PORT: 6379
      MONGO_URI: mongodb://mongo:27017
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - target: 53139
        published: 53139
        protocol: tcp
        mode: ingress
    networks:
      - gmod_net
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: start-first

  discord:
    image: ${DISCORD_IMAGE:-gmod-integration/discord:latest}
    env_file:
      - .env
    environment:
      DEV: ${DEV:-false}
      MARIA_HOST: mariadb
      MARIA_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULLMQ_HOST: redis
      BULLMQ_PORT: 6379
      MONGO_URI: mongodb://mongo:27017
      MINIO_ENDPOINT: http://minio:9000
    networks:
      - gmod_net
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: start-first

  mariadb:
    image: mariadb:11
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIA_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIA_NAME}
      MYSQL_USER: ${MARIA_USER}
      MYSQL_PASSWORD: ${MARIA_PASSWORD}
    ports:
      - target: 3306
        published: 3306
        protocol: tcp
        mode: ingress
    volumes:
      - gmod_mariadb_data:/var/lib/mysql
    networks:
      - gmod_net
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "${MARIA_USER}", "-p${MARIA_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:7
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: ingress
    volumes:
      - gmod_redis_data:/data
    networks:
      - gmod_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  mongo:
    image: mongo:7
    ports:
      - target: 27017
        published: 27017
        protocol: tcp
        mode: ingress
    volumes:
      - gmod_mongo_data:/data/db
    networks:
      - gmod_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - target: 9000
        published: 9060
        protocol: tcp
        mode: ingress
      - target: 9001
        published: 9065
        protocol: tcp
        mode: ingress
    volumes:
      - gmod_minio_data:/data
    networks:
      - gmod_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

volumes:
  gmod_mariadb_data:
  gmod_redis_data:
  gmod_mongo_data:
  gmod_minio_data:

networks:
  gmod_net:
    driver: overlay
    attachable: true
