services:
  mariadb:
    image: mariadb:11
    container_name: gmod_requirements_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIA_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIA_NAME}
      MYSQL_USER: ${MARIA_USER}
      MYSQL_PASSWORD: ${MARIA_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - gmod_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "${MARIA_USER}", "-p${MARIA_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    container_name: gmod_requirements_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gmod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: gmod_requirements_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - gmod_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: gmod_requirements_minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9060:9000"
      - "9065:9001"
    volumes:
      - gmod_minio_data:/data

volumes:
  gmod_mariadb_data:
  gmod_redis_data:
  gmod_mongo_data:
  gmod_minio_data:
